<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo of the Ruins</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud-panel">
        <div class="title">Echo of the Ruins</div>
        <div class="stats">
          <span>Vida: <strong id="healthText">100/100</strong></span>
          <span>Energia: <strong id="energyText">3</strong></span>
          <span>Objetivo: <strong id="objectiveText">Explore e destrua o guardião</strong></span>
        </div>
      </div>

      <div class="controls-panel">
        <div class="action-btn"><span class="label">A / D</span><span class="text">Mover</span></div>
        <div class="action-btn"><span class="label">W / Espaço</span><span class="text">Pular</span></div>
        <div class="action-btn"><span class="label">Shift</span><span class="text">Dash</span></div>
        <div class="action-btn"><span class="label">J / K</span><span class="text">Espada</span></div>
      </div>

      <button id="resetStageBtn" class="reset-btn" type="button">Resetar fase</button>

      <canvas id="game" width="1280" height="720"></canvas>
    </div>

    <script src="game.js"></script>
  </body>
</html>
